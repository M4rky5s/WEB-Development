<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <dialog id="bookDialog">
        <form id="bookForm">
            <label for="author">Author</label>
            <input type="text" id="author"><br>
            <label for="title">Title</label>
            <input type="text" id="title"><br>
            <label for="pages">Number of Pages</label>
            <input type="text" id="pages"><br>
            <p>Select status:</p>
            <input type="radio" id="read" name="status" value="Has Been Read">
            <label for="read">Has Been Read</label><br>
            <input type="radio" id="unread" name="status" value="Unread">
            <label for="unread">Unread</label> <br>
            <button type="button" id="submitBook">Submit a Book</button>
        </form>
    </dialog>
    <button id="addNewBook">Add New Book</button>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Author</th>
                <th>Title</th>
                <th>Number of Pages</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody">

        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
