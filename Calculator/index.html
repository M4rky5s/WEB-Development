<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Calculator</title>
</head>
<body>
    <div id="container">
        <div id="output"></div>
        <div class="button-row">
            <button id="clear"><b>CLEAR</b></button>
            <button id="backspace"><b>←</b></button>
        </div>
        <div class="keypad">
            <button id="button7">7</button><button id="button8">8</button><button id="button9">9</button><button id="button-divide"><b>÷</b></button>
            <button id="button4">4</button><button id="button5">5</button><button id="button6">6</button><button id="button-multiply"><b>×</b></button>
            <button id="button1">1</button><button id="button2">2</button><button id="button3">3</button><button id="button-minus"><b>-</b></button>
            <button id="button0">0</button><button id="button-dot">.</button><button id="button-equal">=</button><button id="button-plus"><b>+</b></button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
